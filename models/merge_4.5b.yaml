# ==============================================================================
# Sent-Code 4.5B (Frankenmerge Recipe)
# 
# Base: Qwen2.5-Coder-3B-Instruct (Layers 0-24) + Qwen2.5-Coder-7B-Instruct (Selected Deep Layers)
# Target Size: ~4.5 Billion Parameters (~2.8 GB in Q4_K_M GGUF format)
# RAM Required to Run: ~3.8 - 4.2 GB (Runs smoothly on any 8GB RAM PC!)
# ==============================================================================

slices:
  - sources:
      - model: Qwen/Qwen2.5-Coder-3B-Instruct
        layer_range: [0, 18]
  - sources:
      - model: Qwen/Qwen2.5-Coder-3B-Instruct
        layer_range: [12, 28]
  - sources:
      - model: Qwen/Qwen2.5-Coder-3B-Instruct
        layer_range: [20, 36]

merge_method: passthrough
dtype: bfloat16

# To execute this merge:
# 1. pip install mergekit
# 2. mergekit-yaml merge_4.5b.yaml ./sent-code-4.5b-output
# 3. python llama.cpp/convert_hf_to_gguf.py ./sent-code-4.5b-output --outtype q4_k_m
